# 一键起演示环境（答辩现场用这个，避免现场装环境翻车）
#
# 用法：
#   docker compose up --build
#   然后浏览器打开 http://127.0.0.1:8000/  （API）
#   前端：浏览器打开宿主机的 web/index.html，会自动连 127.0.0.1:8000
#
# 说明：套餐 A 选了「线程池 + 任务表」而不是 Celery，
# 所以这里只需要一个容器，没有 Redis / worker。少一个组件就少一处现场故障。

services:
  api:
    build: .
    container_name: aihoop-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # 视频、标定、任务库
      - ./out:/app/out            # 分析产物
      - ./web:/app/web:ro         # 前端静态文件（只读挂载）
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    command: uvicorn aihoop.api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # 可选：把前端也托管起来（用 nginx 提供静态文件并反代 API）
  # 不启也不影响，直接双击 web/index.html 一样能用。
  web:
    image: nginx:alpine
    container_name: aihoop-web
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    profiles: ["with-web"]
